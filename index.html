<!doctype html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

  <title>News</title>
  <style>body {
    background: #f8f9fa;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.card {
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    transition: box-shadow 0.3s ease-in-out;
    border-radius: 8px;
    background-color: #fff;
}

.card:hover {
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

img {
    border-radius: 8px 8px 0 0;
    object-fit: cover;
    height: 180px;
}

#newsdetails {
    margin-top: 20px;
}

@media (max-width: 768px) {
    .card {
        margin-bottom: 20px;
    }
}
</style>
</head>

<body class="m-0 p-0">

  <div class="container-fluid m-0 p-0 bg-info">

    <!-- displays the Navbar  -->
    <div>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand text-info" href="#">News</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
            aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ">
              <li class="nav-item">
                <a class="nav-link text-white" aria-current="page" href="#generalnews" id="generalnews">General News</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white " aria-current="page" href="#sports" id="sports">Sports</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#business" id="business">Business</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white " aria-current="page" href="#entertainment" id="entertainment">Entertainment</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-white" href="#technology" id="technology">Technology</a>
              </li>
            </ul>

            <form class="d-flex">
              <input class="form-control me-2" type="text" id="newsinput" placeholder="Search News">
              <button class="btn btn-outline-info" type="button" id="searchBtn">Search</button>
            </form>
          </div>
        </div>
      </nav>
    </div>


    <!-- Displays the General News -->
    <div>
      <div class="row mt-3 text-center text-dark" id="newstype"></div>
      <div class="row me-2 ms-2 p-4" id="newsdetails"></div>

    </div>

    <!--Displays the footer -->
    <div class="mt-5">
      <div>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mt-4">
          <div class="container-fluid">
            <h6 class="text-white me-auto ms-auto">for more news <span class="text-warning">contact us </span> </h6>
          </div>
        </nav>
      </div>

    </div>

  </div>
















  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
